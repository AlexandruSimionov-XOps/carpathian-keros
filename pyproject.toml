[project]
name = "carpathian-keros"
version = "1.0.0"  # single source of truth for the app version (Article IV); keep CHANGELOG.md in sync
description = "Bilingual (RO/EN) weather dashboard for Romania's 319 official cities and towns"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Alexandru Simionov" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "e2e: browser tests against a live server (opt-in: CK_E2E=1, needs Playwright + network)",
    "docker: build and run the production image (opt-in: CK_DOCKER=1, needs Docker + network)",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # intentional Unicode (°, –, −, ș/ț) in strings, docstrings and comments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works
